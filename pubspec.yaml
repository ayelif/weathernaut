name: weathernaut
description: "A new Flutter Weather Application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  slang: ^4.14.0
  slang_flutter: ^4.14.0
  flavor: ^2.0.0
  intl: ^0.20.2
  auto_route: ^11.1.0
  flutter_bloc: ^9.1.1
  flutter_svg: ^2.2.4
  fl_chart: ^1.2.0
  google_fonts: ^8.0.2
  dio: ^5.8.0
  hive_flutter: ^1.1.0
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0
  firebase_storage: ^12.4.0
  equatable: ^2.0.7
  get_it: ^8.0.3
  lottie: ^3.1.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  auto_route_generator: ^10.5.0
  flutter_gen_runner: ^5.9.0
  slang_build_runner: ^4.14.0

flutter:
  uses-material-design: true

  assets:
    - assets/i18n/
    - assets/animations/
    - assets/fonts/

  fonts:
    - family: NotoColorEmoji
      fonts:
        - asset: assets/fonts/NotoColorEmoji.ttf